version: 2

project_name: gospy

before:
  hooks:
    - go mod download

builds:
  - id: gospy
    main: ./cmd/gospy
    binary: gospy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/hakastein/gospy/internal/version.version=v{{ .Version }}
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: gospy
    ids:
      - gospy
    formats:
      - tar.gz
    name_template: 'gospy_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX document per archive, produced by syft. The workflow installs syft
# before calling goreleaser; a local run without syft needs --skip=sbom.
sboms:
  - id: archives
    artifacts: archive

# gospy has to sit next to the PHP process it profiles, because phpspy attaches
# to that process with ptrace. So this image is not a runtime on its own: it is
# a binary source for a php-fpm image.
#
#   COPY --from=ghcr.io/hakastein/gospy:0.12.0 /gospy /usr/local/bin/gospy
dockers_v2:
  - id: gospy
    ids:
      - gospy
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/hakastein/gospy
    tags:
      - '{{ .Version }}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: '{{ .ProjectName }}'
      org.opencontainers.image.description: Ships phpspy profiles to Pyroscope
      org.opencontainers.image.version: '{{ .Version }}'
      org.opencontainers.image.revision: '{{ .FullCommit }}'
      org.opencontainers.image.created: '{{ .Date }}'
      org.opencontainers.image.source: https://github.com/hakastein/gospy
      org.opencontainers.image.licenses: MIT

# The release body comes from mikepenz/release-changelog-builder-action via
# `release --release-notes`; goreleaser ignores that flag when its changelog is
# disabled, so the changelog stays enabled and the flag skips its generation.
changelog:
  use: git

release:
  draft: false
  prerelease: auto
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}'
