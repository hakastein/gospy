version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
      # British spellings the codebase uses in prose and test messages; the
      # linter stays on for everything else.
      ignore-rules:
        - cancelled
        - cancelling
    staticcheck:
      checks:
        - all
        # Stylistic quick-fix: a boolean switch reads fine as-is.
        - -QF1002
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
